name: Build & Release GiBot

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force creating a new release even if HEAD already has a release tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-gibot-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build executable
        run: ./gradlew test executable

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gibot-executable
          path: |
            gibot
            build/libs/*-all.jar
          if-no-files-found: error

      - name: Prepare GitHub release metadata and changelog
        id: release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          git fetch --tags --force
          FORCE_FLAG=""
          if [ "${{ inputs.force_release }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 .github/scripts/prepare_release.py \
            --repo "${{ github.repository }}" \
            --binary ./gibot \
            --notes-out release_notes.md \
            --sha256-out gibot.sha256 \
            --github-output "$GITHUB_OUTPUT" \
            $FORCE_FLAG

      - name: Publish GitHub Release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            ./gibot \
            ./gibot.sha256 \
            --title "${{ steps.release.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --notes-file release_notes.md \
            --latest
